<!DOCTYPE html>
<html>
<title>
    HTML Links - Colors
</title>

<body>
    <style>
        a:link {
            color: green;
            background-color: transparent;
            text-decoration: none
        }

        a:visited {
            color: pink;
            background-color: transparent;
            text-decoration: none
        }

        a:hover {
            color: red;
            background-color: transparent;
            text-decoration: underline
        }

        a:active {
            color: yellow;
            background-color: transparent;
            text-decoration: underline
        }
    </style>
    <a href="https://www.youtube.com/" target="_blank">YouTube link</a>
    <a href="https://www.youtube.com/" target="_self">YouTube link</a>
    <a href="https://www.youtube.com/" target="_parent">YouTube link</a>
    <a href="https://www.youtube.com/" target="_top">YouTube link</a>
    <br>
    <a href="https://www.google.com/search?udm=2&q=smile#vhid=uuLZe_re6eZxoM&vssid=mosaic" target="_blank">
        <img src="smile.jpg" alt="smile face" style="width:42px;height:42px;border:0">
    </a>
    <br><br>
    <a href="html_bookmark.htm#YouTube" target="_blank">visit youtube</a>

</body>

</html>
